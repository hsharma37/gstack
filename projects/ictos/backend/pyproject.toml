[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ictos-backend"
version = "0.2.0"
description = "ICTOS backend — Phase 3 Analytics and Research Engine."
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
sqlmodel = ">=0.0.8"
pydantic = ">=2.9.0"
pydantic-settings = ">=2.0.0"
python-dotenv = ">=1.0.0"
psycopg = {extras = ["binary"], version = ">=3.2.0"}
numpy = ">=1.26.0"
pandas = ">=2.0.0"
vectorbt = ">=0.26.0"
backtrader = ">=1.9.76.123"
pytest = ">=8.0.0"
httpx = ">=0.27.0"
